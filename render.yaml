services:
  - type: web
    name: ticketflow-community
    plan: starter
    env: python
    region: frankfurt  # region should be same as your database region.
    buildCommand: "./build.sh"
    startCommand: "gunicorn run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: APP_NAME
        value: TicketFlow Community
      - key: GOOGLE_AUTO_PROVISION
        value: false
